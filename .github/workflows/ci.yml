name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test, Prisma, Typecheck, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prostuti_user
          POSTGRES_PASSWORD: prostuti_password
          POSTGRES_DB: prostuti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prostuti_user -d prostuti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: "postgresql://prostuti_user:prostuti_password@localhost:5432/prostuti_test?schema=public"
      JWT_SECRET: "ci-test-jwt-secret-key-at-least-32-chars-long"
      BOOTSTRAP_TOKEN: "ci-test-bootstrap-token-12345"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. Prisma (Generate Client & Push Ephemeral Schema)
        run: |
          pnpm run generate
          pnpm exec prisma db push --skip-generate

      - name: 2. Typecheck
        run: pnpm run typecheck

      - name: 3. Test
        run: pnpm run test

      - name: 4. Build
        run: pnpm run build
